name: PHP lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verificar sintaxe de todos os ficheiros PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
